name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository and core submodule
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            core/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./core[dev]" -e .

      - name: Check installed dependencies
        run: python -m pip check

      - name: Check Django configuration and migrations
        env:
          DJANGO_SETTINGS_MODULE: deploy.settings_test
        run: |
          python deploy/manage.py check
          python deploy/manage.py makemigrations --check --dry-run

      - name: Run VNN tests
        run: python -m pytest

      - name: Run core tests
        run: python -m pytest -c core/pytest.ini core/tests

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: core/frontend

    steps:
      - name: Check out repository and core submodule
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: core/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run core frontend tests
        run: npm test

      - name: Build
        run: npm run build

  container:
    name: Base image build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build backend base image
        run: docker build --file deploy/Dockerfile --tag eval-platform:ci .
